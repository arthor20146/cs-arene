<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS Arena</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud" class="hide">
  <div id="vign"></div>
  <div id="scope"></div>
  <div id="hurt"></div>
  <div id="hurtlow"></div>
  <div id="flash"></div>
  <div id="dmgdir"><i></i></div>
  <div id="cross" class="xh"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i><i class="dot"></i></div>
  <div id="hitm"></div>

  <div id="top">
    <div><div class="sc" id="sCT">0</div><div class="lb">ANTI-TERRORISTES</div></div>
    <div id="timer">0:00</div>
    <div><div class="sc" id="sT">0</div><div class="lb">TERRORISTES</div></div>
  </div>
  <canvas id="radar" width="340" height="340"></canvas>
  <canvas id="bigmap" class="hide" width="900" height="900"></canvas>
  <div id="feed"></div>
  <div id="notice"></div>
  <div id="center"><div id="banner"></div></div>
  <div id="streak"></div>
  <div id="prompt"></div>
  <div id="progw"><div id="prog"></div></div>
  <div id="spec"></div>
  <div id="chatlog"></div>
  <div id="fps"></div>

  <div id="vitals">
    <div><div class="n" id="hpn">100</div><div class="l">SANTÉ</div></div>
    <div><div class="n" id="arn">0</div><div class="l">GILET</div></div>
    <div><div class="n" id="money">$800</div><div class="l" id="roundl">Manche 1</div></div>
  </div>
  <div id="ammo">
    <div id="wname"></div>
    <div class="n"><span id="mag">0</span> <small>/ <span id="res">0</span></small></div>
    <div id="icons"></div>
  </div>
</div>
<input id="chatin" type="text" maxlength="120" class="hide" placeholder="Message… (Entrée pour envoyer)">

<!-- Tableau des scores -->
<div id="board" class="hide"></div>

<!-- Boutique -->
<div id="buy" class="ov hide"><div class="card">
  <h2>Boutique</h2>
  <div id="buyMoney">$0</div>
  <div id="buyBody"></div>
  <button class="go ghost" id="buyClose">Fermer (B)</button>
</div></div>

<!-- Paramètres -->
<div id="settings" class="ov hide" role="dialog" aria-modal="true" aria-label="Paramètres"><div class="card">
  <div class="sethead"><h2>Paramètres</h2><button class="x" id="setX" type="button" aria-label="Fermer">&#x2715;</button></div>
  <div class="setbody">
    <nav class="settabs" id="setTabs"></nav>
    <div class="setpane" id="setPane"></div>
  </div>
  <div class="setfoot">
    <span id="setMsg"></span><span class="grow"></span>
    <button type="button" id="setResetTab">Réinitialiser l'onglet</button>
    <button type="button" id="setResetAll">Tout réinitialiser</button>
    <button type="button" class="primary" id="setClose">Fermer</button>
  </div>
</div></div>

<!-- Pause -->
<div id="pause" class="ov hide"><div class="card">
  <h2>Partie en pause</h2>
  <p class="sub">Clique pour reprendre le contrôle de la souris.</p>
  <button class="go" id="resume">Reprendre</button>
  <button class="go ghost" id="setPause">Paramètres</button>
  <button class="go ghost" id="leave">Quitter la partie</button>
</div></div>

<!-- Menu principal -->
<div id="menu" class="ov"><div class="mwrap">
  <div class="rail">
    <div class="brand"><span>CS</span><h1>ARENA</h1><p>T contre CT · pose ou désamorce la bombe</p></div>
    <nav>
      <button class="nav on" id="navPlay">JOUER</button>
      <button class="nav" id="setMenu">PARAMÈTRES</button>
    </nav>
  </div>
  <div class="mpanel">
    <div class="mhead"><h2>NOUVELLE PARTIE</h2><span class="chip">MODE · BOMBE</span></div>
    <div class="sec">CARTE</div>
    <div class="cards maps" id="maps">
      <button data-m="dust" style="--c:#d9a441"><b>DUST</b><small>Désert · classique</small></button>
      <button data-m="docks" style="--c:#4aa3c7"><b>DOCKS</b><small>Port · conteneurs</small></button>
      <button data-m="medina" style="--c:#c9684a"><b>MÉDINA</b><small>Ruelles · couvert</small></button>
      <button data-m="cargo" style="--c:#8ccf4d"><b>CARGO</b><small>Hangar · industriel</small></button>
    </div>
    <div class="sec">ÉQUIPE</div>
    <div class="cards teams" id="teams">
      <button data-t="auto" class="on"><b>AUTO</b><small>Équilibrage automatique</small></button>
      <button data-t="T"><b>TERRORISTES</b><small>Pose la bombe</small></button>
      <button data-t="CT"><b>ANTI-TERRORISTES</b><small>Désamorce la bombe</small></button>
    </div>
    <div class="sec">JOUEUR</div>
    <div class="fields">
      <div><label class="f">PSEUDO</label><input type="text" id="name" maxlength="16" placeholder="Ton pseudo" autocomplete="off"></div>
      <div><label class="f">SALLE (même code que tes amis)</label><input type="text" id="room" maxlength="16" placeholder="main" autocomplete="off"></div>
    </div>
    <button class="go big" id="play">JOUER</button>
    <div class="err" id="err"></div>
    <details class="khelp"><summary>Voir les touches</summary><div class="keys" id="keysHelp"></div></details>
  </div>
</div></div>

<script src="three.min.js"></script>
<script src="shared.js"></script>
<script src="audio.js"></script>
<script src="gfx.js"></script>
<script src="models.js"></script>
<script src="settings.js"></script>
<script src="game.js"></script>
</body>
</html>
